<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Notch for Windows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Inject BetterLaunch badge into the React footer once it renders
      new MutationObserver(function(_, obs) {
        var footer = document.querySelector('footer');
        if (!footer) return;
        var linkRow = footer.querySelector('div > div');
        if (!linkRow || linkRow.querySelector('.bl-badge')) return;
        var a = document.createElement('a');
        a.href = 'https://www.betterlaunch.co/product/smart-notch';
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.className = 'bl-badge';
        a.style.cssText = 'transition:transform 0.2s;display:inline-flex;';
        a.onmouseover = function() { a.style.transform = 'scale(1.05)'; };
        a.onmouseout = function() { a.style.transform = 'scale(1)'; };
        var img = document.createElement('img');
        img.src = 'https://www.betterlaunch.co/badge-launching-dark.svg';
        img.alt = 'Smart notch on Better Launch';
        img.width = 200;
        img.height = 56;
        a.appendChild(img);
        linkRow.appendChild(a);
        obs.disconnect();
      }).observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
    <script type="module" src="https://get.microsoft.com/badge/ms-store-badge.bundled.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
