<svg width="256" height="256" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="island-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background behind the glow so it's not transparent if needed, or leave it transparent -->
  <rect x="2" y="8" width="28" height="16" rx="8" stroke="url(#island-grad)" stroke-width="1" stroke-opacity="0.4" fill="transparent" />
  
  <rect x="6" y="10" width="20" height="12" rx="6" fill="#020617" stroke="url(#island-grad)" stroke-width="1.5" filter="url(#glow)" />
  
  <circle cx="21" cy="16" r="2.5" fill="url(#island-grad)" />
  
  <rect x="10" y="14" width="1.5" height="4" rx="0.75" fill="#38BDF8" />
  <rect x="13" y="13" width="1.5" height="6" rx="0.75" fill="#A855F7" />
  <rect x="16" y="14.5" width="1.5" height="3" rx="0.75" fill="#38BDF8" />
</svg>
